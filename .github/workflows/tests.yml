# Intégration continue : la suite de tests tourne seule à chaque push.
#
# ## Ce que ce workflow vérifie — et ce qu'il ne vérifie PAS
#
# Il exécute la suite de tests (la même commande que localement, voir
# pytest.ini) sur un serveur GitHub à chaque push sur master et chaque pull
# request. La pastille verte/rouge du dépôt reflète alors l'état réel du code.
#
# Il ne vérifie PAS le comptage : la suite ne charge jamais torch ni les
# modèles réels (imports paresseux dans compteur/detecteur.py, faux YOLO dans
# tests/test_detecteur.py). Il dit « le code est cohérent », pas « le logiciel
# compte juste » — la vérité terrain reste `tools/verite_terrain.py`.
#
# ## Les réglages non évidents, et pourquoi ils sont là
#
# - `QT_QPA_PLATFORM=offscreen` : les tests d'interface instancient de vrais
#   widgets PySide6 ; sans écran physique, Qt chargerait la plateforme
#   « xcb » qui échoue faute de display. Le mode offscreen rend l'écran
#   inutile. Les libs système ci-dessous (`libegl1`, `libgl1`) sont ce dont
#   ce mode a besoin sur Ubuntu.
# - **torch en version CPU uniquement** : la suite n'a pas besoin de CUDA, et
#   la wheel CUDA de `pip install torch` pèse plusieurs Go et tire une chaîne
#   entière de paquets NVIDIA. Le index CPU ne change RIEN pour les tests :
#   aucun tenseur n'est calculé. `torchvision` doit venir du MÊME index, sinon
#   pip « répare » la paire en reinstallant la version CUDA.
# - **Cache pip** : sans lui, chaque run retélécharge ~1,5 Go (torch, PySide6,
#   opencv...). Le cache est clé sur `requirements.txt` : changer une
#   dépendance invalide le proprement.
# - `-m "not slow"` : les tests slow lancent des sous-processus complets
#   (installateur, démarrages d'app), écrits pour la machine de dev
#   Windows. Les faire tourner ici demanderait de les porter, pour un gain de
#   couverture marginal : la passe rapide (500+ tests) couvre la logique.
# - `PYTHONIOENCODING=utf-8` : reproduit le garde-fou CP1252 imposé par la
#   console Windows (AGENTS.md). Inoffensif sur Linux, il garde les deux
#   environnements sur la même configuration d'encodage.

name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Un push rapide suivant annule le run en cours : inutile de dépenser des
# minutes GitHub sur un état déjà dépassé.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dépendances Qt pour le rendu offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Dépendances Python (torch CPU)
        run: |
          python -m pip install --upgrade pip
          # torch/torchvision CPU d'abord, DU MÊME index : `pip install
          # -r requirements.txt` voit alors `torch>=2.4` déjà satisfait et ne
          # retombe pas sur la wheel CUDA de PyPI.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Suite de tests (passe rapide)
        run: python -m pytest -m "not slow" -q
